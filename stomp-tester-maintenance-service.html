<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>STOMP WebSocket Tester</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --accent: #3fb950;
    --danger: #f85149;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 20px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 16px;
    color: var(--text);
  }
  .status {
    display: inline-block;
    margin-left: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
    border: 1px solid var(--border);
    color: var(--dim);
  }
  .status.connected { color: var(--accent); border-color: var(--accent); }
  .status.error { color: var(--danger); border-color: var(--danger); }

  .grid {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
  }
  .panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--dim);
    margin: 0 0 10px;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 11px;
    color: var(--dim);
    margin: 10px 0 4px;
  }
  input, textarea {
    width: 100%;
    background: #0d1117;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
  }
  textarea { resize: vertical; min-height: 50px; }
  button {
    background: #21262d;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    margin-top: 8px;
    margin-right: 6px;
  }
  button:hover:not(:disabled) { background: #30363d; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: #238636; border-color: #2ea043; }
  button.primary:hover:not(:disabled) { background: #2ea043; }
  button.danger { background: #3d1c1c; border-color: var(--danger); }

  .row { display: flex; gap: 8px; align-items: center; }
  .sub-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    margin-top: 6px;
    font-size: 12px;
  }
  .sub-item span { color: var(--dim); }
  .sub-item button { margin: 0; padding: 3px 8px; font-size: 11px; }

  #log {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    height: calc(100vh - 80px);
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.6;
  }
  .entry { padding: 4px 0; border-bottom: 1px solid #1c2128; white-space: pre-wrap; word-break: break-word; }
  .entry:last-child { border-bottom: none; }
  .dir-out { color: #ffa657; }
  .dir-in { color: #7ee787; }
  .dir-sys { color: var(--dim); }
  .dir-err { color: var(--danger); }
  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    margin-right: 6px;
    border: 1px solid currentColor;
  }
  .time { color: var(--dim); font-size: 11px; margin-right: 6px; }
  .clear-btn { float: right; }
</style>
</head>
<body>

<h1>STOMP WebSocket Tester<span id="status" class="status">disconnected</span></h1>

<div class="grid">
  <div>
    <div class="panel">
      <h2>Connection</h2>
      <label>WebSocket URL</label>
      <input id="wsUrl" value="ws://localhost:7879/v1/user/register-to-maintenance-service" />
      <label>JWT (without "Bearer ")</label>
      <textarea id="jwt" placeholder="eyJhbGciOi..."></textarea>
      <div class="row">
        <button class="primary" id="connectBtn" onclick="doConnect()">Connect</button>
        <button class="danger" id="disconnectBtn" onclick="doDisconnect()" disabled>Disconnect</button>
      </div>
      <button class="primary" id="autoBtn" onclick="runFullTest()" style="width:100%; margin-top:10px;">Run full test (connect → subscribe both → send)</button>
    </div>

    <div class="panel" style="margin-top:14px;">
      <h2>Subscribe</h2>
      <label>Destination</label>
      <input id="subDest" value="/broadcast/connection" />
      <button onclick="doSubscribe()" id="subBtn" disabled>Subscribe</button>
      <div class="row" style="margin-top:8px;">
        <button onclick="quickSub('/broadcast/connection')" class="quick-sub" disabled>+ Broadcast</button>
        <button onclick="quickSub('/user/broadcast/connection')" class="quick-sub" disabled>+ Private queue</button>
      </div>
      <div id="subList"></div>
    </div>

    <div class="panel" style="margin-top:14px;">
      <h2>Send</h2>
      <label>Destination</label>
      <input id="sendDest" value="/v1/user/websocket/connection" />
      <label>Body (JSON)</label>
      <textarea id="sendBody">{"status":"ONLINE"}</textarea>
      <button class="primary" onclick="doSend()" id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <div class="panel" style="padding:0; overflow:hidden;">
    <div style="padding:12px 12px 0;">
      <h2 style="display:inline-block;">Log</h2>
      <button class="clear-btn" onclick="clearLog()">Clear</button>
    </div>
    <div style="margin: 8px 12px 0;">
      <div style="font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px;">Last message received</div>
      <div id="lastMsg" style="background:#0d1117; border:1px solid var(--accent); border-radius:4px; padding:10px; font-size:13px; color:var(--accent); min-height:20px;">
        (nothing yet)
      </div>
    </div>
    <div id="log" style="height: calc(100% - 110px); margin: 12px 12px 12px;"></div>
  </div>
</div>

<script>
let client = null;
let subs = {}; // id -> {dest, subscription}
let subCounter = 0;

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');

function ts() {
  const d = new Date();
  return d.toTimeString().split(' ')[0] + '.' + String(d.getMilliseconds()).padStart(3,'0');
}

function log(dir, tagText, text) {
  const div = document.createElement('div');
  div.className = 'entry dir-' + dir;
  const tag = `<span class="tag">${tagText}</span>`;
  const time = `<span class="time">${ts()}</span>`;
  div.innerHTML = time + tag + escapeHtml(text);
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function clearLog() { logEl.innerHTML = ''; }

function setStatus(state, text) {
  statusEl.className = 'status ' + state;
  statusEl.textContent = text;
}

function setConnectedUI(isConnected) {
  document.getElementById('connectBtn').disabled = isConnected;
  document.getElementById('disconnectBtn').disabled = !isConnected;
  document.getElementById('subBtn').disabled = !isConnected;
  document.getElementById('sendBtn').disabled = !isConnected;
  document.querySelectorAll('.quick-sub').forEach(b => b.disabled = !isConnected);
}

function doConnect() {
  const url = document.getElementById('wsUrl').value.trim();
  const jwt = document.getElementById('jwt').value.trim();

  if (!url) { log('err', 'ERR', 'WebSocket URL is required'); return; }

  const socket = new WebSocket(url);
  client = Stomp.over(socket);
  client.debug = null; // silence built-in console spam; we log manually below

  const headers = {};
  if (jwt) headers['Authorization'] = 'Bearer ' + jwt;

  log('sys', 'SYS', 'Opening WebSocket to ' + url);
  setStatus('', 'connecting…');

  client.connect(
    headers,
    function (frame) {
      setStatus('connected', 'connected');
      setConnectedUI(true);
      log('in', 'CONNECTED', frame || '(no frame details returned)');
    },
    function (error) {
      setStatus('error', 'error');
      setConnectedUI(false);
      log('err', 'ERROR', typeof error === 'string' ? error : JSON.stringify(error));
    }
  );

  log('out', 'CONNECT', 'accept-version:1.2,1.1,1.0\nheart-beat:10000,10000' +
      (jwt ? '\nAuthorization:Bearer ' + jwt.slice(0, 20) + '...' : '\n(no Authorization header set)'));
}

function doDisconnect() {
  if (client) {
    client.disconnect(function () {
      log('sys', 'SYS', 'Disconnected cleanly');
    });
  }
  subs = {};
  document.getElementById('subList').innerHTML = '';
  setStatus('', 'disconnected');
  setConnectedUI(false);
}

function quickSub(dest) {
  document.getElementById('subDest').value = dest;
  doSubscribe();
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runFullTest() {
  const btn = document.getElementById('autoBtn');
  btn.disabled = true;
  log('sys', 'AUTO', 'Starting full test run…');

  if (!client || !client.connected) {
    doConnect();
    // wait until connected or errored, up to 5s
    let waited = 0;
    while ((!client || !client.connected) && waited < 5000) {
      await wait(100);
      waited += 100;
    }
    if (!client || !client.connected) {
      log('err', 'AUTO', 'Could not connect within 5s — aborting test run.');
      btn.disabled = false;
      return;
    }
  }

  await wait(300);
  document.getElementById('subDest').value = '/broadcast/connection';
  doSubscribe();

  await wait(300);
  document.getElementById('subDest').value = '/user/broadcast/connection';
  doSubscribe();

  await wait(300);
  document.getElementById('sendDest').value = '/v1/user/websocket/connection';
  document.getElementById('sendBody').value = '{"status":"ONLINE"}';
  doSend();

  log('sys', 'AUTO', 'Test run sent — watch the log above for MESSAGE frames.');
  btn.disabled = false;
}

function doSubscribe() {
  const dest = document.getElementById('subDest').value.trim();
  if (!dest) { log('err', 'ERR', 'Destination is required'); return; }
  if (!client || !client.connected) { log('err', 'ERR', 'Not connected'); return; }

  const id = 'sub-' + (subCounter++);
  const subscription = client.subscribe(dest, function (message) {
    log('in', 'MESSAGE', `[${dest}] ${message.body}`);
    document.getElementById('lastMsg').textContent = message.body;
  }, { id: id });

  subs[id] = { dest, subscription };
  log('out', 'SUBSCRIBE', `id:${id}\ndestination:${dest}`);
  renderSubs();
}

function unsubscribe(id) {
  if (subs[id]) {
    subs[id].subscription.unsubscribe();
    log('out', 'UNSUBSCRIBE', `id:${id}`);
    delete subs[id];
    renderSubs();
  }
}

function renderSubs() {
  const container = document.getElementById('subList');
  container.innerHTML = '';
  Object.entries(subs).forEach(([id, { dest }]) => {
    const div = document.createElement('div');
    div.className = 'sub-item';
    div.innerHTML = `<span>${id} → ${dest}</span>`;
    const btn = document.createElement('button');
    btn.textContent = 'Unsub';
    btn.onclick = () => unsubscribe(id);
    div.appendChild(btn);
    container.appendChild(div);
  });
}

function doSend() {
  const dest = document.getElementById('sendDest').value.trim();
  const body = document.getElementById('sendBody').value;

  if (!dest) { log('err', 'ERR', 'Destination is required'); return; }
  if (!client || !client.connected) { log('err', 'ERR', 'Not connected'); return; }

  try {
    JSON.parse(body); // validate JSON, but send as raw string
  } catch (e) {
    log('err', 'ERR', 'Body is not valid JSON: ' + e.message);
    return;
  }

  client.send(dest, { 'content-type': 'application/json' }, body);
  log('out', 'SEND', `destination:${dest}\ncontent-type:application/json\n\n${body}`);
}
</script>

</body>
</html>
